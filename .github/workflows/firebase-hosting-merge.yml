name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - master
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    env:
      DEV: false
      VITE_BASE_URL: https://api-test.stimi-yapmi.ac.id
      VITE_GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.VITE_GOOGLE_OAUTH_CLIENT_ID }}

    steps:
      - uses: actions/checkout@v4
      - run: rm -f package-lock.json && rm -rf yarn.lock && npm install && npm run build
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PSYCH_ADDF2 }}
          channelId: live
          projectId: psych-addf2
